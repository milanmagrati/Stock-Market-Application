<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="omwayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Rounded Base Tile -->
  <rect width="48" height="48" rx="12" fill="url(#omwayGradient)"/>
  
  <!-- Subtle Market Grid Line -->
  <line x1="8" y1="36" x2="40" y2="36" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Market Bars (Background Accent) -->
  <rect x="11" y="27" width="4" height="9" rx="1.5" fill="rgba(255,255,255,0.25)"/>
  <rect x="19" y="21" width="4" height="15" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  <rect x="27" y="16" width="4" height="20" rx="1.5" fill="rgba(255,255,255,0.35)"/>
  <rect x="35" y="10" width="4" height="26" rx="1.5" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Dynamic Trending Up Bullish Indicator -->
  <polyline points="9,31 19,23 27,27 38,13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <polyline points="30,13 38,13 38,21" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Peak Highlight Dot -->
  <circle cx="38" cy="13" r="2" fill="#38bdf8"/>
</svg>